<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>京云杯#5海选计算器-beta</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            align-items: center;
        }
        .container {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            padding: 20px;
            gap: 20px;
            max-width: 100%;
            box-sizing: border-box;
        }
        @media (min-width: 1910px) {
            .container {
                width: 100%;
            }
        }
        .frame {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 20px; /* 添加内边距 */
            flex: 1 1 calc(50% - 10px);
            width: auto;
            min-width: 320px;
            margin-bottom: 20px;
            box-sizing: border-box; /* 确保内边距包含在宽度计算内 */
        }

        h3 {
            text-align: center;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .label {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 5px;
        }
        .select, .input, .checkbox, .button {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
            min-width: 120px;
            box-sizing: border-box; /* 包含内边距和边框 */
        }
        .checkbox {
            display: inline-block;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #fff;
        }
        .checkbox:hover {
            background-color: #f0f0f0;
        }
        .mult-checkbox {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 10px;
            border: 2px solid #d6d6d6;
            border-radius: 5px;
            background-color: #fafafa;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all .15s ease;
            user-select: none;
            text-align: center;
            line-height: 1.3;
        }
        .mult-checkbox:hover {
            border-color: #4CAF50;
            background-color: #f0f9f0;
        }
        .mult-checkbox input {
            margin-right: 5px;
            accent-color: #4CAF50;
            flex-shrink: 0;
        }
        .mult-checkbox:has(input:checked) {
            background-color: #4CAF50;
            border-color: #4CAF50;
            color: #ffffff;
        }
        .checkbox-container .mult-checkbox {
            flex: 1 1 100% !important;
            max-width: 100% !important;
            min-width: 100% !important;
            white-space: normal;
        }
        .pair-row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 15px;
        }
        .pair-row .input-container {
            flex: 1;
            margin-bottom: 0;
        }
        .pair-row .mech-chk {
            flex: 0 0 auto;
            margin: 0;
            min-width: 0;
            padding: 12px 16px;
        }
        .tri-chk .checkbox {
            flex: 1 1 calc(33.333% - 10px) !important;
            max-width: calc(33.333% - 10px) !important;
            min-width: calc(33.333% - 10px) !important;
        }
        .pair-row {
            align-items: stretch;
        }
        .pair-row .input-container {
            display: flex;
            align-items: center;
        }
        .pair-row .input-container .label {
            line-height: 36px;
            height: 36px;
        }
        .pair-row .mech-chk {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 36px;
            box-sizing: border-box;
            white-space: nowrap;
        }
        .tri-chk .checkbox {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 44px;
            box-sizing: border-box;
            white-space: normal;
            line-height: 1.3;
            text-align: center;
        }
        .sp-area {
            width: 100%;
            box-sizing: border-box;
        }
        .sp-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
            width: 100%;
            box-sizing: border-box;
        }
        .sp-label {
            flex: 0 0 76px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            height: 36px;
            box-sizing: border-box;
            text-align: right;
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
        }
        .sp-field {
            flex: 1;
            min-width: 0;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .sp-area .input {
            margin-bottom: 0;
        }
        .sp-row > .input {
            margin-bottom: 0;
        }
        .sp-field .input {
            flex: 1;
            min-width: 0;
        }
        .sp-chk-row {
            flex: 1;
            min-width: 0;
            display: flex;
            gap: 10px;
            align-items: stretch;
        }
        .sp-chk-row .chk {
            flex: 1;
            min-width: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 11px 8px;
            border: 2px solid #d6d6d6;
            border-radius: 5px;
            background-color: #fafafa;
            cursor: pointer;
            font-size: 14px;
            text-align: center;
            line-height: 1.3;
            white-space: normal;
            user-select: none;
            box-sizing: border-box;
        }
        .sp-chk-row .chk:hover {
            border-color: #4CAF50;
            background-color: #f0f9f0;
        }
        .sp-chk-row .chk input {
            margin-right: 5px;
            accent-color: #4CAF50;
            flex-shrink: 0;
        }
        .sp-chk-row .chk:has(input:checked) {
            background-color: #4CAF50;
            border-color: #4CAF50;
            color: #ffffff;
        }
        @media (max-width: 900px) {
            .sp-row {
                flex-wrap: wrap;
            }
            .sp-label {
                flex: 0 0 100%;
                text-align: left;
                justify-content: flex-start;
            }
            .sp-field, .sp-chk-row {
                flex: 1 1 100%;
            }
            .sp-chk-row {
                flex-wrap: wrap;
            }
            .sp-chk-row .chk {
                flex: 1 1 calc(50% - 10px);
            }
        }
        @media (max-width: 600px) {
            .sp-chk-row .chk {
                flex: 1 1 100%;
            }
        }

        .grid-row {
            display: grid;
            grid-template-columns: 72px 1fr;
            gap: 10px;
            align-items: center;
            margin-bottom: 15px;
        }
        .g-label {
            text-align: right;
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
        }
        .g-content {
            display: flex;
            gap: 10px;
            align-items: center;
            min-width: 0;
        }
        .g-content .input {
            flex: 1;
            min-width: 0;
        }
        .g-content .mech-chk {
            flex: 0 0 auto;
            margin: 0;
            white-space: nowrap;
            height: 36px;
            box-sizing: border-box;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .tri-chk .checkbox {
            white-space: nowrap;
        }
        .checkbox-container {
            display: flex;
            flex-wrap: wrap; /* 允许换行 */
            gap: 10px; /* 多选框之间的间距 */
            justify-content: space-around; /* 均匀分布，避免对齐问题 */
        }

        .checkbox-container .checkbox {
            flex: 1 1 calc(25% - 10px); /* 确保每行最多容纳4个 */
            max-width: calc(25% - 10px); /* 限制最大宽度 */
            min-width: calc(25% - 10px); /* 保证最小宽度 */
            box-sizing: border-box; /* 包含内边距和边框 */
            text-align: center;
        }
        .checkbox-container .checkbox:only-child {
            flex: 1 1 100%; /* 独占整行时占满整行 */
            max-width: 100%; /* 确保宽度适应整行 */
            min-width: 100%;
        }
        .input-container {
            display: flex;
            align-items: baseline; /* 垂直居中对齐 */
            gap: 10px; /* 添加间距 */
            margin-bottom: 15px;
        }

        .input-container .label {
            flex: 0 0 30%; /* 固定宽度 */
            height: 36px;
            text-align: right; /* 右对齐 */
            white-space: nowrap; /* 防止换行 */
            line-height: 36px; /* 设置与输入框一致的行高 */
        }

        .input-container .input {
            flex: 1 1 70%; /* 占用剩余宽度 */
            height: 36px; /* 确保输入框高度一致 */
            padding: 5px; /* 添加内边距 */
            box-sizing: border-box; /* 包含内边距和边框 */
        }


        .input-grid {
            display: flex;
            flex-wrap: wrap; /* 允许换行 */
            gap: 10px; /* 控制输入框间距 */
        }

        .input-grid .input-container {
            flex: 1 1 calc(50% - 10px); /* 宽屏时每行两个 */
            max-width: calc(50% - 10px); /* 最大宽度 */
            box-sizing: border-box; /* 包含内边距和边框 */
        }
        .button {
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        .button:hover {
            background-color: #45a049;
        }
        .divider {
            height: 5px;
            background-color: #aaa;
            margin: 10px 0;
        }
        .inputspecial{
            width: 100%;
            font-weight: bold;
            font-size: 20px;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
            box-sizing: border-box; /* 包含内边距和边框 */
        }
        .fight-container {
            display: flex;
            flex-direction: row; /* 默认左右排列 */
            justify-content: space-between;
            align-items: stretch; /* 子元素高度一致 */
            gap: 20px; /* 间距 */
            position: relative;
        }

        .fight-container .frame {
            flex: 1 1 45%; /* 每部分占45%的宽度 */
            box-sizing: border-box;
            border-radius: 0; /*紧密排列时不再显示边框*/
            box-shadow: 0 0 10px rgba(0, 0, 0, 0);
        }

        .divider-vertical {
            width: 5px; /* 分隔线宽度 */
            background-color: #aaa;
            height: auto;
            align-self: stretch;
            margin: 0 10px;
        }
        /* 右侧按钮容器 */
        .button-container {
            display: flex;
            gap: 10px; /* 按钮之间的间距 */
            justify-content: flex-start; /* 左对齐按钮 */
        }
        /*此宽度以下藏品设置框不能一排显示四个*/
        @media (max-width: 1440px) {
            .checkbox-container .checkbox {
                flex: 1 1 45%; /* 小屏幕每行最多2个 */
                max-width: 45%; /* 限制宽度 */
                min-width: 45%; /* 保证对齐 */
            }
        }
        /*此宽度以下按钮、添加作战、输入框不能一排显示两个*/
        @media (max-width: 1080px) {
            .button-container {
                flex-direction: column; /* 手机端垂直排列 */
                align-items: stretch; /* 按钮占满整行 */
            }
            .fight-container {
                flex-direction: column; /* 垂直排列 */
            }
            .fight-container .frame {
                width: 100%;
            }
            .divider-vertical {
                width: 100%; /* 改为横向分隔线 */
                height: 5px;
                margin: 10px 0;
            }
            .input-grid .input-container {
                flex: 1 1 100%; /* 窄屏时每行一个 */
                max-width: 100%; /* 最大宽度改为整行 */
            }
        }
        /* 此宽度以下只能显示一列UI */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                align-items: center;
            }
            .frame {
                width: 90%;
            }
        }
        /* 此宽度以下藏品选择每行只能显示一个 */
        @media (max-width: 480px) {
            .checkbox-container .checkbox {
                flex: 1 1 100%; /* 竖屏设备时每行一个 */
                max-width: 100%;
                min-width: 100%;
            }
        }
        textarea{
            resize: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Left Side -->
        <div class="frame">
            <h3>状态设置</h3>
            <div class="label">开局分队</div>
            <select id="team" class="select">
                <option>本源研修分队</option>
                <option>文明开化分队</option>
                <option>开拓者分队</option>
                <option>多边贸易分队</option>
                <option>地质调查分队</option>
                <option>指挥分队</option>
                <option>特勤分队</option>
                <option>后勤分队</option>
                <option>矛头分队</option>
                <option>突击战术分队</option>
                <option>堡垒战术分队</option>
                <option>远程战术分队</option>
                <option>破坏战术分队</option>
                <option>高台突破分队</option>
                <option>地面突破分队</option>
            </select>



            <div class="divider"></div>

            <div class="fight-container">
                <!-- 紧急作战 -->
                <div class="frame">
                    <h3>紧急作战</h3>
                    <div class="label">紧急作战</div>
                    <select id="emergency" class="select">
                        <option>三层-预算否决</option>
                        <option>三层-生存习性</option>
                        <option>三层-黑色逆流</option>
                        <option>三层-辟路行进</option>
                        <option>三层-趁火打劫</option>
                        <option>三层-焦土之家</option>
                        <option>四层-未来见闻</option>
                        <option>四层-其他紧急</option>
                        <option>五层-物欲遮天</option>
                        <option>五层-恶意讨薪</option>
                        <option>五层-送别仪式</option>
                        <option>五层-彼处水如酒</option>
                        <option>五层-一步之遥</option>
                        <option>五层-丛林法则</option>
                        <option>五层-过度繁殖</option>
                        <option>六层-同域共存</option>
                        <option>六层-命运共享</option>
                        <option>三层-无效收尸</option>
                        <option>四层-无效收尸</option>
                        <option>五层-无效收尸</option>
</select>
                    <div class="checkbox-container">
                        <label class="checkbox mult-checkbox"><input type="checkbox" id="heiliudi" onchange="emergencyMult(this)"> 黑流地脉</label>
                        <label class="checkbox mult-checkbox"><input type="checkbox" id="qingxie" onchange="emergencyMult(this)"> 倾斜沙丘/去温栏/易碎同盟/停止点</label>
                    </div>
                    <button class="button" onclick="addEmergency()">添加紧急作战</button>
                </div>

                <!-- 分隔线 -->
                <div class="divider-vertical"></div>

                <!-- 领袖作战 -->
                <div class="frame">
                    <h3>领袖作战</h3>
                    <div class="label">领袖作战</div>
                    <select id="boss" class="select">
                        <option>永无安宁</option>
                        <option>痛苦将息</option>
                        <option>混沌源阶理论</option>
                        <option>畸症（击杀玻利瓦尔，症结之核）通关</option>
                        <option>畸症（生吃玻利瓦尔，症结之核）通关</option>
                        <option>追猎畸症（击杀玻利瓦尔，症结之核）通关</option>
                        <option>追猎畸症（生吃玻利瓦尔，症结之核）通关</option>
</select>
                    <div class="checkbox-container">
                        <label class="checkbox"><input type="checkbox" id="noLeak"> 无漏通关</label>
                    </div>
                    <button class="button" onclick="addBoss()">添加领袖作战</button>
                    <div class="divider"></div>
                    <h3>追猎关卡</h3>
                    <div class="label">追猎关卡</div>
                    <select id="hunt" class="select">
                        <option>二层-咩的朋友</option>
                        <option>二层-一视同仁</option>
                        <option>二层-外显尖牙</option>
                        <option>三层-哀悼铁腕</option>
                        <option>三层-赤金厄运</option>
                        <option>三层-冰冷流亡</option>
                        <option>四层-"闹乐"</option>
                        <option>四层-"纵怒"</option>
                        <option>四层-"灭身"</option>
                    </select>
                    <button class="button" onclick="addHunt()">添加追猎关卡</button>
                </div>
            </div>

            <div class="divider"></div>
            <h3>特殊加分</h3>
            <div class="sp-area">
                <div class="sp-row">
                    <span class="sp-label">商店取钱</span>
                    <input id="money" class="input" type="number" placeholder="输入金额">
                </div>
                <div class="sp-row">
                    <span class="sp-label">六星数量</span>
                    <div class="sp-field">
                        <input id="sixN" class="input" type="number" placeholder="含临时">
                        <label class="chk"><input type="checkbox" id="mech"> 抓取机械师</label>
                    </div>
                </div>
                <div class="sp-row">
                    <span class="sp-label"></span>
                    <div class="sp-chk-row">
                        <label class="chk"><input type="checkbox" id="alpha"> 沙盘α</label>
                        <label class="chk"><input type="checkbox" id="beta"> 沙盘β</label>
                        <label class="chk"><input type="checkbox" id="beacon"> 怦然信标</label>
                    </div>
                </div>
                <div class="sp-row">
                    <span class="sp-label"></span>
                    <div class="sp-chk-row">
                        <label class="chk"><input type="checkbox" id="nonhome"> 非本家5-6星数量0</label>
                        <label class="chk"><input type="checkbox" id="nomud"> 全程无实托邦</label>
                        <label class="chk"><input type="checkbox" id="allhunt"> 全程追猎</label>
                    </div>
                </div>
            </div>

        </div>



        <!-- Right Side -->
        <div class="frame">

            <div class="label">违规扣分</div>
            <input id="penal" class="input" type="number" placeholder="输入分数">

            <h3>计分板</h3>
            <textarea id="counter" class="input" rows="20" placeholder="" disabled></textarea>

            <div class="horizontal">
                <button class="button" onclick="deleteLastItem()">删除最后一项</button>
            </div>

            <div class="horizontal">
                <div class="label">结算分</div>
                <input id="submit" class="input" type="number" placeholder="输入分数">
                <button class="button" onclick="confirmScore()">结算!</button>
            </div>

            <textarea id="end" class="inputspecial" rows="1" placeholder="当前得分:0" disabled></textarea>
            <button class="button" onclick="clearAll()">归零!</button>
        </div>
    </div>

    <script>
        let isConfirmed = 1;



        function addEmergency() {
            if(isConfirmed!==1){
                alert("请勿在结算后添加作战");
                return;
            }
            const emergencyDict = {
                "三层-预算否决": 40,
                "三层-生存习性": 40,
                "三层-黑色逆流": 40,
                "三层-辟路行进": 30,
                "三层-趁火打劫": 30,
                "三层-焦土之家": 30,
                "三层-无效收尸": 100,
                "四层-未来见闻": 100,
                "四层-其他紧急": 80,
                "四层-无效收尸": 80,
                "五层-物欲遮天": 100,
                "五层-恶意讨薪": 100,
                "五层-送别仪式": 100,
                "五层-彼处水如酒": 100,
                "五层-一步之遥": 80,
                "五层-丛林法则": 80,
                "五层-过度繁殖": 80,
                "五层-无效收尸": 50,
                "六层-同域共存": 200,
                "六层-命运共享": 150
            };
            const type = document.getElementById('emergency').value;
            const layer = type.split("-")[0];
            const basicScore = emergencyDict[type];
            let mult = 1;
            let mark = "";
            let multName = "";
            if (document.getElementById('heiliudi').checked) { mult = 2; mark = " 黑流地脉"; multName = "黑流地脉"; }
            if (document.getElementById('qingxie').checked) { mult = 1.5; mark = " 倾斜沙丘"; multName = "倾斜沙丘"; }
            let finalScore = Math.floor(basicScore * mult);

            if (type.indexOf("无效收尸") > -1) {
                insertCounter(`无效收尸 ${type}${mark}`, finalScore);
                return;
            }

            let existingMults = getLayerMults(layer);
            if (existingMults.size > 0 && !(existingMults.size === 1 && existingMults.has(multName))) {
                alert("同一层内实托邦加成需一致");
                return;
            }

            let oldScore = getEmergencyScore(layer);
            let counterText = document.getElementById('counter').value;
            if (finalScore <= oldScore) {
                counterText += `${type}${mark} 0分\n`;
                document.getElementById('counter').value = counterText;
                return;
            }
            removeEmergencyLine(layer);
            counterText += `${type}${mark} ${finalScore}分\n`;
            document.getElementById('counter').value = counterText;
            refreshScore(finalScore - oldScore);
        }

        function getLayerMults(layer) {
            let lines = document.getElementById('counter').value.split('\n');
            let mults = new Set();
            for (let i = 0; i < lines.length; i++) {
                if (lines[i].startsWith(layer + "-")) {
                    if (lines[i].indexOf('黑流地脉') > -1) mults.add('黑流地脉');
                    else if (lines[i].indexOf('倾斜沙丘') > -1) mults.add('倾斜沙丘');
                    else mults.add('无');
                }
            }
            return mults;
        }

        function getEmergencyScore(layer) {
            let lines = document.getElementById('counter').value.split('\n');
            let max = 0;
            for (let i = 0; i < lines.length; i++) {
                if (lines[i].startsWith(layer + "-")) {
                    let parts = lines[i].split(' ');
                    let last = parts[parts.length - 1];
                    let sc = parseInt(last.substring(0, last.length - 1));
                    if (sc > max) max = sc;
                }
            }
            return max;
        }

        function removeEmergencyLine(layer) {
            let lines = document.getElementById('counter').value.split('\n');
            let removed = 0;
            let target = -1;
            for (let i = 0; i < lines.length; i++) {
                if (lines[i].startsWith(layer + "-")) {
                    let parts = lines[i].split(' ');
                    let last = parts[parts.length - 1];
                    let sc = parseInt(last.substring(0, last.length - 1));
                    if (sc > removed) { removed = sc; target = i; }
                }
            }
            if (target >= 0) lines.splice(target, 1);
            document.getElementById('counter').value = lines.join('\n');
            return removed;
        }

        function emergencyMult(el) {
            const h = document.getElementById('heiliudi');
            const q = document.getElementById('qingxie');
            if (h.checked && q.checked) {
                if (el === h) q.checked = false;
                else h.checked = false;
            }
        }

        function addBoss() {
            if(isConfirmed!==1){
                alert("请勿在结算后添加作战");
                return;
            }
            const bossDict = {
                "永无安宁": 0,
                "痛苦将息": 600,
                "混沌源阶理论": 500,
                "畸症（击杀玻利瓦尔，症结之核）通关": 700,
                "畸症（生吃玻利瓦尔，症结之核）通关": 400,
                "追猎畸症（击杀玻利瓦尔，症结之核）通关": 800,
                "追猎畸症（生吃玻利瓦尔，症结之核）通关": 500
            };

            const bossType = document.getElementById('boss').value;
            const group = bossType.indexOf("畸症") > -1 ? "B" : "A";
            if (leaderGroupHas(group)) {
                alert("该组领袖只能添加一个");
                return;
            }
            let finalScore = bossDict[bossType];
            let label = "领·" + bossType;

            if (!document.getElementById('noLeak').checked && bossType.indexOf("击杀玻利瓦尔，症结之核") === -1) {
                finalScore -= 100;
                if (finalScore < 0) finalScore = 0;
            }

            insertCounter(label, finalScore);
        }

        function leaderGroupHas(group) {
            let lines = document.getElementById('counter').value.split('\n');
            for (let i = 0; i < lines.length; i++) {
                if (lines[i].indexOf("领·") === 0) {
                    let isB = lines[i].indexOf("畸症") > -1;
                    if ((group === "B" && isB) || (group === "A" && !isB)) return true;
                }
            }
            return false;
        }

        function addHunt() {
            if(isConfirmed!==1){
                alert("请勿在结算后添加作战");
                return;
            }
            const huntDict = {
                "二层-咩的朋友": 20,
                "二层-一视同仁": 20,
                "二层-外显尖牙": 30,
                "三层-哀悼铁腕": 50,
                "三层-赤金厄运": 50,
                "三层-冰冷流亡": 40,
                '四层-"闹乐"': 50,
                '四层-"纵怒"': 50,
                '四层-"灭身"': 50
            };
            const type = document.getElementById('hunt').value;
            const layer = type.split("-")[0];
            if (getHuntLayerCount(layer) >= 2) {
                alert("该层追猎关卡最多添加两个");
                return;
            }
            if (getHuntTotalCount() >= 4) {
                alert("追猎关卡总数最多四个");
                return;
            }
            let score = huntDict[type];
            let counterText = document.getElementById('counter').value;
            counterText += `猎·${type} ${score}分\n`;
            document.getElementById('counter').value = counterText;
            refreshScore(score);
        }

        function getHuntLayerCount(layer) {
            let lines = document.getElementById('counter').value.split('\n');
            let cnt = 0;
            for (let i = 0; i < lines.length; i++) {
                if (lines[i].indexOf("猎·" + layer + "-") === 0) cnt++;
            }
            return cnt;
        }

        function getHuntTotalCount() {
            let lines = document.getElementById('counter').value.split('\n');
            let cnt = 0;
            for (let i = 0; i < lines.length; i++) {
                if (lines[i].indexOf("猎·") === 0) cnt++;
            }
            return cnt;
        }

        function hasLayerHunt(layer) {
            return getHuntLayerCount(layer) > 0;
        }

        function hasBoss(name) {
            let lines = document.getElementById('counter').value.split('\n');
            for (let i = 0; i < lines.length; i++) {
                if (lines[i].indexOf("领·" + name) === 0) return true;
            }
            return false;
        }

        function insertCounter(label, score) {
            let counterText = document.getElementById('counter').value;
            let prefix = label.split(" ")[0];
            let lines=counterText.split('\n');
            let isprinted=true;
            for(let i=0;i<lines.length;i++){
                let prefixlist=lines[i].split(" ");
                let end = prefixlist.length;
                if (prefixlist[0] === prefix) {
                    isprinted=false;
                    if (parseInt(prefixlist[end - 1].substring(0, prefixlist[end - 1].length - 1)) < score) {
                        refreshScore(-parseInt(prefixlist[end - 1].substring(0, prefixlist[end - 1].length - 1)));
                        lines.splice(i, 1);
                        isprinted = true;
                        break;
                    }
                }
            }
            counterText=lines.join("\n");
            if(isprinted){
                counterText += `${label} ${score}分\n`;
                refreshScore(score);
            }
            document.getElementById('counter').value = counterText;
        }

        function refreshScore(score) {
            let currentScore = parseInt(document.getElementById('end').value.split(':')[1])||0;
            currentScore += score;
            document.getElementById('end').value = "当前得分:" + currentScore;
        }

        function deleteLastItem() {
            for(let times=0;times<isConfirmed;times++) {
                let counterText = document.getElementById('counter').value;
                let lines = counterText.split('\n');
                if (lines.length === 0) {
                    return;
                }
                lines.pop();
                let lastLine = lines.pop();
                prefix = lastLine.split(" ");
                let lastScore = parseInt(prefix[prefix.length - 1].substr(0, prefix[prefix.length - 1].length - 1));
                document.getElementById('counter').value = lines.join('\n');
                if (lines.length !== 0) document.getElementById('counter').value += "\n";
                refreshScore(-lastScore);
            }
            isConfirmed=1;
        }

        function confirmScore() {
            if(isConfirmed!==1){
                alert("请勿重复结算");
                return;
            }
            const team = document.getElementById('team').value;
            const money = parseInt(document.getElementById('money').value)||0;
            const sixN = parseInt(document.getElementById('sixN').value)||0;
            const mech = document.getElementById('mech').checked;
            const alpha = document.getElementById('alpha').checked;
            const beta = document.getElementById('beta').checked;
            const beacon = document.getElementById('beacon').checked;
            const submit = parseInt(document.getElementById('submit').value)||0;
            const penal = parseInt(document.getElementById('penal').value)||0;
            if (money > 40) {
                let deducted = (money - 40) * 500;
                insertCounter(`商店取钱${money}个`, -deducted);
                isConfirmed++;
            }
            if (!mech && sixN > 0) {
                let sixScore = 0;
                if (sixN <= 3) sixScore = 500;
                else if (sixN <= 6) sixScore = 200;
                else if (sixN > 9) sixScore = -200;
                if (sixScore !== 0) {
                    insertCounter(`六星数量${sixN}个`, sixScore);
                    isConfirmed++;
                }
            }
            if (alpha) { insertCounter("沙盘α", 80); isConfirmed++; }
            if (beta) { insertCounter("沙盘β", 100); isConfirmed++; }
            if (beacon) { insertCounter("怦然信标", 100); isConfirmed++; }
            const nonhome = document.getElementById('nonhome').checked;
            const nomud = document.getElementById('nomud').checked;
            const allhunt = document.getElementById('allhunt').checked;
            if (nonhome && ["突击战术分队","堡垒战术分队","破坏战术分队","远程战术分队"].indexOf(team) > -1) {
                insertCounter("非本家5-6星数量0", 300); isConfirmed++;
            }
            if (nomud && team === "文明开化分队") {
                insertCounter("全程无实托邦", 200); isConfirmed++;
            }
            if (allhunt && hasLayerHunt("二层") && hasLayerHunt("三层") && hasLayerHunt("四层") && hasBoss("痛苦将息") && hasBoss("追猎畸症")) {
                insertCounter("全程追猎", 500); isConfirmed++;
            }
            insertCounter(`结算分${submit}分`, Math.floor(submit * 0.3));
            if (penal > 0) {
                insertCounter(`违规扣分${penal}分`, -penal);
            }
            if (team === "多边贸易分队") {
                let cur = parseInt(document.getElementById('end').value.split(':')[1]) || 0;
                document.getElementById('end').value = "当前得分:" + Math.floor(cur * 0.9);
            }
        }
        function clearAll() {
            document.getElementById('counter').value = '';
            document.getElementById('end').value = "当前得分:0";
            isConfirmed = 1;
        }
    </script>
</body>
</html>
